version: '3.8'
services:
  nexus:
    build: .
    container_name: nexus
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "5900-5929:5900-5929"
      - "6080-6109:6080-6109"
    shm_size: '2gb'
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_certs:/config

volumes:
  caddy_data:
  caddy_certs:
